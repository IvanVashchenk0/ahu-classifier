<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AHU Component Recognition</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      padding: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    #preview {
      max-width: 100%;
      height: auto;
      margin-top: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    #result {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #loading {
      display: none;
      margin-top: 1rem;
    }
    #batchResults {
      background-color: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .category-section {
      margin-bottom: 1.5rem;
    }
    .category-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .file-list {
      list-style-type: none;
      padding-left: 1rem;
      margin: 0;
    }
    .file-list li {
      padding: 0.25rem 0;
      color: #666;
      font-size: 0.9rem;
    }
    #processFolder:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>AHU Component Recognition</h1>
  
  <div style="margin-bottom: 2rem;">
    <h2 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Single Image</h2>
    <input id="imageUpload" type="file" accept="image/*" capture="environment" />
  </div>
  
  <div style="margin-bottom: 2rem; padding-top: 1rem; border-top: 1px solid #ddd;">
    <h2 style="font-size: 1.2rem; margin-bottom: 0.5rem;">Batch Processing</h2>
    <input id="folderUpload" type="file" webkitdirectory directory multiple accept="image/*" style="margin-bottom: 1rem;" />
    <button id="processFolder" style="display: none; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 4px;">Process Folder</button>
  </div>
  
  <div id="loading">Loading model, please wait...</div>
  <img id="preview" alt="Image preview" />
  <div id="result"></div>
  <div id="batchResults" style="display: none; margin-top: 2rem; text-align: left; max-width: 100%;"></div>

  <!-- TensorFlow.js library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
